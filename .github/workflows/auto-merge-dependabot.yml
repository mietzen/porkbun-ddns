name: Auto-merge Dependabot

on:
  pull_request_target:
    types:
      - opened
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
          else
            for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --author app/dependabot --state open --json number -q '.[].number'); do
              gh pr merge "$pr" --auto --squash --repo "$GITHUB_REPOSITORY"
            done
          fi
