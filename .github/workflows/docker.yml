name: Docker

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3). Defaults to latest release."
        required: false
        type: string

permissions:
  contents: read

jobs:
  Setup:
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'docker'))
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.set-matrix.outputs.version }}
      should_push: ${{ steps.set-matrix.outputs.should_push }}
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Matrix-Jobs
      id: set-matrix
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_ACTION: ${{ github.event.action }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        SHOULD_PUSH="false"
        if [[ "${EVENT_NAME}" == 'release' ]]; then
          SHOULD_PUSH="true"
          if grep -c -E '^v[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}$' <<< "${REF_NAME}"; then
            VERSION=$(sed 's/^v//' <<< "${REF_NAME}")
          else
            echo "Invalid release tag: ${REF_NAME}"
            exit 1
          fi
        elif [[ "${EVENT_NAME}" == 'workflow_dispatch' ]] || [[ "${EVENT_NAME}" == 'pull_request' && "${PR_ACTION}" == 'closed' ]]; then
          SHOULD_PUSH="true"
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | jq -r '.name' | sed 's/^v//')
          fi
          if ! grep -c -E '^[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}$' <<< "${VERSION}"; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi
        else
          VERSION='0.0.0'
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT
        {
          echo "build_matrix<<EOF"
          cat .github/platforms.json
          echo "EOF"
        } >> $GITHUB_OUTPUT

  Build:
    runs-on: ${{ matrix.platforms.runner }}
    needs: Setup
    strategy:
      fail-fast: false
      matrix:
        ${{ insert }}: ${{ fromJson(needs.Setup.outputs.build_matrix) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Install Perquisites
      run: |
        curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor -v 5

    - name: Build
      env:
        DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || 'user' }}
        BUILD_NR: ${{ github.run_number }}
        PLATFORM: ${{ matrix.platforms.platform }}
        VERSION: ${{ needs.Setup.outputs.version }}
      run: |
        ARCH=$(echo "${PLATFORM}" | awk -F  "/" '{print $2$3}')
        echo ""
        echo "============================================================="
        echo "Building: ${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}"
        echo "============================================================="
        echo ""
        docker buildx build \
          --tag "${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}" \
          --platform ${PLATFORM} \
          --build-arg PORKBUN_DDNS_VERSION=${VERSION} \
          --load \
          -f ./Docker/Dockerfile .

    - name: Test
      env:
        DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || 'user' }}
        BUILD_NR: ${{ github.run_number }}
        PLATFORM: ${{ matrix.platforms.platform }}
        VERSION: ${{ needs.Setup.outputs.version }}
        CI_DEBUG_MODE: ${{ runner.debug }}
      working-directory: './Docker'
      run: |
        set -a
        ARCH=$(echo "${PLATFORM}" | awk -F  "/" '{print $2$3}')
        echo ""
        echo "============================================================="
        echo "Testing: ${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}"
        echo "============================================================="
        echo ""
        exec ./test/test.sh
        echo ""

    - name: Login to Docker Hub
      if: needs.Setup.outputs.should_push == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_HUB_USERNAME || 'user' }}
        password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

    - name: Push Images
      if: needs.Setup.outputs.should_push == 'true'
      env:
        DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || 'user' }}
        BUILD_NR: ${{ github.run_number }}
        PLATFORM: ${{ matrix.platforms.platform }}
        VERSION: ${{ needs.Setup.outputs.version }}
      run: |
        ARCH=$(echo "${PLATFORM}" | awk -F  "/" '{print $2$3}')
        echo ""
        echo "============================================================="
        echo "Pushing: ${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}"
        echo "============================================================="
        echo ""
        docker tag "${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}" "${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}"
        docker tag "${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}" "${DOCKER_USER}/porkbun-ddns:${ARCH}"
        docker push "${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}"
        docker push "${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}"
        docker push "${DOCKER_USER}/porkbun-ddns:${ARCH}"

  Shared-Manifest:
    if: needs.Setup.outputs.should_push == 'true'
    runs-on: ubuntu-26.04
    needs:
      - Build
      - Setup
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_HUB_USERNAME || 'user' }}
        password: ${{ secrets.DOCKER_HUB_DEPLOY_KEY }}

    - name: Create and push shared manifest
      env:
        DOCKER_USER: ${{ vars.DOCKER_HUB_USERNAME || 'user' }}
        BUILD_NR: ${{ github.run_number }}
        VERSION: ${{ needs.Setup.outputs.version }}
      run: |
        echo ""
        echo "============================================================="
        echo "Pushing shared manifest: ${DOCKER_USER}/porkbun-ddns:${VERSION}"
        echo "============================================================="
        echo ""
        echo "#!/bin/bash" > push-shared-tags.sh
        echo -n "docker manifest create ${DOCKER_USER}/porkbun-ddns:${VERSION}" >> push-shared-tags.sh
        while read -r PLATFORM; do
          ARCH=$(echo "${PLATFORM}" | awk -F  "/" '{print $2$3}')
          echo -n " ${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}" >> push-shared-tags.sh
        done <<< "$(cat .github/platforms.json | jq -r '.platforms[] | .platform')"
        echo "" >> push-shared-tags.sh
        echo -n "docker manifest create ${DOCKER_USER}/porkbun-ddns:latest" >> push-shared-tags.sh
        while read -r PLATFORM; do
          ARCH=$(echo "${PLATFORM}" | awk -F  "/" '{print $2$3}')
          echo -n " ${DOCKER_USER}/porkbun-ddns:${VERSION}-${ARCH}-${BUILD_NR}" >> push-shared-tags.sh
        done <<< "$(cat .github/platforms.json | jq -r '.platforms[] | .platform')"
        echo "" >> push-shared-tags.sh
        echo "docker manifest push ${DOCKER_USER}/porkbun-ddns:${VERSION}" >> push-shared-tags.sh
        echo "docker manifest push ${DOCKER_USER}/porkbun-ddns:latest" >> push-shared-tags.sh
        cat push-shared-tags.sh
        chmod +x ./push-shared-tags.sh
        ./push-shared-tags.sh

  Check-Build:
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    needs:
      - Build
      - Shared-Manifest
    steps:
      - run: |
          result="${{ needs.Build.result }}"
          manifest="${{ needs.Shared-Manifest.result }}"
          if [[ ($result == "success" || $result == "skipped") && ($manifest == "success" || $manifest == "skipped") ]]; then
            exit 0
          else
            exit 1
          fi
